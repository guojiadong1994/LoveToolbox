name: Build and Release Windows

# 与原项目保持一致：推送 v* 标签时自动构建并发布。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests pyinstaller

      # 自动获取 Windows FFmpeg 静态构建，包含 ffmpeg.exe 和 ffprobe.exe。
      - name: Download FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-release-essentials.zip'
          $extracted = Join-Path $env:RUNNER_TEMP 'ffmpeg-extracted'

          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extracted -Force

          $ffmpeg = Get-ChildItem -Path $extracted -Filter 'ffmpeg.exe' -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extracted -Filter 'ffprobe.exe' -File -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw '下载包中未找到 ffmpeg.exe 或 ffprobe.exe，停止打包。'
          }

          New-Item -ItemType Directory -Path 'vendor/ffmpeg' -Force | Out-Null
          Copy-Item -Path $ffmpeg.FullName -Destination 'vendor/ffmpeg/ffmpeg.exe' -Force
          Copy-Item -Path $ffprobe.FullName -Destination 'vendor/ffmpeg/ffprobe.exe' -Force

          if (-not (Test-Path 'vendor/ffmpeg/ffmpeg.exe') -or -not (Test-Path 'vendor/ffmpeg/ffprobe.exe')) {
            throw 'FFmpeg / FFprobe 文件准备失败。'
          }

      # 嵌入 onefile 的 ffmpeg 子目录，视频模块可从 sys._MEIPASS/ffmpeg 找到它们。
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --name="LoveToolbox" --windowed --onefile --clean --noconfirm `
            --add-binary "vendor/ffmpeg/ffmpeg.exe:ffmpeg" `
            --add-binary "vendor/ffmpeg/ffprobe.exe:ffmpeg" `
            main.py

          if (-not (Test-Path 'dist/LoveToolbox.exe')) {
            throw '打包失败：未生成 LoveToolbox.exe'
          }

      - name: Release to GitHub
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/LoveToolbox.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
